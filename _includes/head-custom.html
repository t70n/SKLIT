<!--
  Included in the <head> of every page by the GitHub Pages themes (jekyll-theme-primer).
  It renders the LaTeX formulas with MathJax and turns the outline of README.md
  (the element with class "markmap") into an interactive markmap mindmap.
  GitHub's own Markdown renderer ignores this file: on github.com the formulas are
  rendered natively and the outline is displayed as a table of contents.
-->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
  /* markmap also adds the class "markmap" to the generated <svg>, hence the div selectors. */
  div.markmap {
    position: relative;
  }
  div.markmap > svg {
    width: 100%;
    height: 80vh;
    min-height: 560px;
  }
  /* Readable fallback while the mindmap is loading or if scripts are blocked. */
  div.markmap:not(:has(> svg)) {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8em;
  }
</style>
<script>
  window.markmap = { autoLoader: { manual: true, toolbar: true } };
</script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18.12"></script>
<script>
  (function () {
    // Display options of the mindmap, passed to markmap as front matter.
    var FRONT_MATTER = [
      "---",
      "markmap:",
      "  colorFreezeLevel: 2",
      "  initialExpandLevel: 3",
      "  maxWidth: 300",
      "  spacingVertical: 6",
      "---",
      ""
    ].join("\n");

    // Point the links of the outline to the pages generated by Jekyll:
    // "folder/README.md" becomes "folder/" and "page.md" becomes "page.html".
    function toSiteLinks(markdown) {
      return markdown.replace(/\]\(([^)\s]+)\)/g, function (match, target) {
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) || target.charAt(0) === "#" || target.charAt(0) === "/") {
          return match;
        }
        var hashIndex = target.indexOf("#");
        var path = hashIndex >= 0 ? target.slice(0, hashIndex) : target;
        var anchor = hashIndex >= 0 ? target.slice(hashIndex) : "";
        if (/(^|\/)README\.md$/i.test(path)) {
          path = path.replace(/README\.md$/i, "") || "./";
        } else if (/\.md$/i.test(path)) {
          path = path.replace(/\.md$/i, ".html");
        }
        return "](" + path + anchor + ")";
      });
    }

    function renderMindmaps() {
      var elements = document.querySelectorAll("div.markmap");
      for (var i = 0; i < elements.length; i++) {
        elements[i].textContent = FRONT_MATTER + toSiteLinks(elements[i].textContent.trim());
      }
      window.markmap.autoLoader.renderAll();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", renderMindmaps);
    } else {
      renderMindmaps();
    }
  })();
</script>
